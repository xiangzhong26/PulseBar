name: Refresh product screenshots

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run screenshots
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/monitor.png docs/images/settings.png
          git diff --cached --quiet || git commit -m "docs: refresh product screenshots"
          git push
